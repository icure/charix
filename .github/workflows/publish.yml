name: Publish
on:
  release:
    types: [released, prereleased]
jobs:
  publish:
    name: Release build and publish
    runs-on: self-hosted
#    permissions:
#      contents: read
#      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup local.properties
        id: setup-local
        run: |
          echo "githubUsername=${{ secrets.CHARIX_GITHUB_USERNAME }}" > local.properties
          echo "githubPassword=${{ secrets.CHARIX_GITHUB_PASSWORD }}" >> local.properties

      - name: Publish to Github Packages
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository --no-configuration-cache -PgitTag=${{ github.ref_name }}

      - name: Remove local.properties
        if: ${{ always() }}
        run: rm -f local.properties
